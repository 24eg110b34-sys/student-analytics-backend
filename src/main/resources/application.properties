server.port=${PORT:8080}

# ---- MySQL (change username/password or set DB_URL / DB_USERNAME / DB_PASSWORD env vars) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_analytics?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT (secret must be at least 32 characters; override with JWT_SECRET in production) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-before-deploying}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Frontend origins allowed by CORS (comma separated) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- Load demo students, marks and attendance on the first start (empty database only) ----
app.seed=${SEED_DEMO_DATA:true}
